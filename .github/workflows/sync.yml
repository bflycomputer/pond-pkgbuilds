name: Sync CachyOS packages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cachyos-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Install checksum tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends makepkg pacman-package-manager

      - name: Generate sync app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: bflycomputer
          repositories: pond-pkgbuilds
          permission-contents: write
          permission-pull-requests: write

      - name: Check out Pond
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch CachyOS upstreams
        id: upstreams
        run: |
          git remote add cachyos https://github.com/CachyOS/CachyOS-PKGBUILDS.git
          git fetch --no-tags cachyos master
          git remote add cachyos-kernels https://github.com/CachyOS/linux-cachyos.git
          git fetch --no-tags cachyos-kernels master

      - name: Open PKGBUILD sync pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POND_BRANCH: main
          POND_UPSTREAM_REPOSITORY: CachyOS/CachyOS-PKGBUILDS
          POND_PACKAGE_MAP: .github/cachyos-packages.tsv
        run: .github/scripts/sync-upstream.sh refs/remotes/cachyos/master

      - name: Open kernel sync pull requests
        if: ${{ !cancelled() && steps.upstreams.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POND_BRANCH: main
          POND_UPSTREAM_REPOSITORY: CachyOS/linux-cachyos
          POND_PACKAGE_MAP: .github/linux-cachyos-packages.tsv
        run: .github/scripts/sync-upstream.sh refs/remotes/cachyos-kernels/master
